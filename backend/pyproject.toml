
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitywars-backend"
version = "0.1.0"
description = "Gravity Wars multiplayer game server"
requires-python = ">=3.11"

dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
