name: Gravity Wars checks

on:
  pull_request:
  push:
    branches:
      - feature/friends-only-access
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  frontend-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -e './backend[dev]'
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Check frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm run build
      - name: Run browser tests against a temporary local game
        env:
          E2E_ADMIN_PASSWORD: ci-only-test-password
          E2E_BASE_URL: http://127.0.0.1:3000
          ALLOWED_ORIGINS: http://127.0.0.1:3000
          NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:8000
          NEXT_PUBLIC_WS_ORIGIN: ws://127.0.0.1:8000
          ACCESS_DATABASE_PATH: ${{ runner.temp }}/gravitywars-ci.sqlite3
        shell: bash
        run: |
          set -euo pipefail
          export ADMIN_PASSWORD_HASH="$(python -c 'import os; from argon2 import PasswordHasher; print(PasswordHasher().hash(os.environ["E2E_ADMIN_PASSWORD"]))')"
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/gw-api.log" 2>&1) &
          api_pid=$!
          (cd frontend && npm run dev -- --hostname 127.0.0.1 > "$RUNNER_TEMP/gw-web.log" 2>&1) &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          cd frontend
          npm run test:e2e
